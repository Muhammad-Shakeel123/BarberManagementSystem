# Base44 sandbox / development stack for the Barber Management System.
#
# Runs the app from the cloned source (bind mounts + dev servers with live reload):
#   web  -> Vite dev server (host port 3000, the preview entry point)
#   api  -> Express + Socket.IO with nodemon (host port 8000)
#   mongo, redis                 -> local infrastructure for the API
#   seed -> one-shot demo data job (run manually, it wipes collections)
#
#   docker compose -f docker-compose.base44.yml up -d --build
#   docker compose -f docker-compose.base44.yml run --rm seed   # first run / reset demo data
#
name: barber-management

services:
  mongo:
    image: mongo:7
    restart: on-failure
    command: ["mongod", "--bind_ip_all"]
    environment:
      - MONGO_INITDB_DATABASE=barber-management
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7
    restart: on-failure
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    image: node:22
    labels:
      base44.project: "API (Express)"
      base44.kind: "api"
      base44.port: "8000"
    working_dir: /app
    command:
      [
        "sh",
        "-ec",
        "npm ci --no-audit --no-fund && exec npx nodemon -r dotenv/config src/index.js",
      ]
    restart: on-failure
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
      - api_npm_cache:/root/.npm
    ports:
      - "8000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - TIMEZONE=Asia/Karachi
      - JWT_EXPIRES_IN=1d
      - MONGODB_URI=mongodb://mongo:27017/barber-management
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - MAX_FUTURE_DAYS=30
      - MIN_ADVANCE_MINUTES=30
      - NO_SHOW_GRACE_MINUTES=15
      - QUEUE_MAX_CAPACITY=50
      - SLOT_INTERVAL_MINUTES=15
      # Base44 sandbox only: enables CORS for the preview origin (see src/app.js).
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
    env_file:
      # Committed development placeholders first, platform secrets last (they win).
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Express /health + Mongo-backed boot: the process only listens after the
      # MongoDB, Redis and Bull connections are established.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

  web:
    image: node:22
    labels:
      base44.project: "Frontend (Vite + React)"
      base44.kind: "web"
      base44.port: "3000"
    working_dir: /app
    command:
      [
        "sh",
        "-ec",
        "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    restart: on-failure
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_npm_cache:/root/.npm
    ports:
      - "3000:5173"
    environment:
      # Separate-origin wiring, as documented in frontend/.env.example: the API is
      # reachable on its own public port. Values are referenced, never hardcoded.
      - VITE_API_BASE_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}/api/v1
      - VITE_SOCKET_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Base44 sandbox only: lets the Vite dev server accept the proxied preview host.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    env_file:
      # Vite only exposes VITE_* variables to the browser bundle.
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

  # One-shot demo data job. Kept behind the `setup` profile so plain `up` never
  # wipes data; run it explicitly on a fresh database:
  #   docker compose -f docker-compose.base44.yml --profile setup run --rm seed
  seed:
    image: node:22
    profiles: ["setup"]
    working_dir: /app
    command:
      [
        "sh",
        "-ec",
        "npm ci --no-audit --no-fund && exec node -r dotenv/config src/seed/index.js",
      ]
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
      - api_npm_cache:/root/.npm
    environment:
      - NODE_ENV=development
      - TIMEZONE=Asia/Karachi
      - JWT_EXPIRES_IN=1d
      - MONGODB_URI=mongodb://mongo:27017/barber-management
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  api_node_modules:
  web_node_modules:
  api_npm_cache:
  web_npm_cache:
